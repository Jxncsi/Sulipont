<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tankönyvbörze – Sulipont</title>
  <meta name="description" content="Használt tankönyvek és jegyzetek diákoktól diákoknak: keresés tantárgyra és évfolyamra, kedvencek.">
  <link rel="stylesheet" href="konyv.css">
</head>
<body>
  <a class="skip-link" href="#main">Ugrás a tartalomra</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="talalt.html" aria-label="Sulipont – kezdőlap">
        <svg class="brand-mark" viewBox="0 0 56 56" aria-hidden="true">
          <text x="28" y="40" text-anchor="middle">S</text>
          <path d="M9 31C5 16 21 6 36 9c14 3 17 20 7 30-9 9-27 10-35-3"/>
        </svg>
        <span class="brand-name">Sulipont</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menü megnyitása">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Főmenü">
        <a class="tab tab-found" href="talalt.html">Talált tárgyak</a>
        <a class="tab tab-exams" href="dolgozat.html">Dolgozatnaptár</a>
        <a class="tab tab-books" href="konyv.html" aria-current="page">Tankönyvbörze</a>
        <a class="tab tab-docs" href="../docs.html">Dokumentáció</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <div class="page-head">
      <div>
        <h1>Tankönyvbörze</h1>
        <p class="lead">Használt tankönyvek és jegyzetek. Keress tantárgyra és évfolyamra, és jelöld meg a kedvenceidet.</p>
        <button class="btn btn-primary" id="new-btn" type="button">+ Hirdetés feladása</button>
      </div>
      <div class="leaf" aria-hidden="true">
        <span class="leaf-month" id="leaf-month"></span>
        <strong class="leaf-day" id="leaf-day"></strong>
        <span class="leaf-week" id="leaf-week"></span>
      </div>
    </div>

    <!-- Hirdetés feladása (a gombra nyílik) -->
    <form class="panel form form-narrow" id="book-form" novalidate hidden>
      <div class="field">
        <label for="b-title">Cím</label>
        <input type="text" id="b-title" maxlength="80" placeholder="pl. Matematika 9. tankönyv" required aria-describedby="err-b-title">
        <p class="error" id="err-b-title" role="alert"></p>
      </div>
      <div class="row">
        <div class="field">
          <label for="b-subject">Tantárgy</label>
          <select id="b-subject" required aria-describedby="err-b-subject"></select>
          <p class="error" id="err-b-subject" role="alert"></p>
        </div>
        <div class="field">
          <label for="b-grade">Évfolyam</label>
          <select id="b-grade" required aria-describedby="err-b-grade"></select>
          <p class="error" id="err-b-grade" role="alert"></p>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="b-condition">Állapot</label>
          <select id="b-condition" required aria-describedby="err-b-condition"></select>
          <p class="error" id="err-b-condition" role="alert"></p>
        </div>
        <div class="field">
          <label for="b-price">Ár (Ft)</label>
          <input type="number" id="b-price" min="0" max="20000" step="50" inputmode="numeric" required aria-describedby="err-b-price">
          <p class="error" id="err-b-price" role="alert"></p>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="b-seller">Neved és osztályod</label>
          <input type="text" id="b-seller" maxlength="60" placeholder="pl. Kiss Anna, 12.A" autocomplete="name" required aria-describedby="err-b-seller">
          <p class="error" id="err-b-seller" role="alert"></p>
        </div>
        <div class="field">
          <label for="b-contact">Elérhetőség</label>
          <input type="text" id="b-contact" maxlength="60" placeholder="e-mail vagy telefonszám" required aria-describedby="err-b-contact">
          <p class="error" id="err-b-contact" role="alert"></p>
        </div>
      </div>
      <div class="field">
        <label for="b-desc">Megjegyzés (nem kötelező)</label>
        <textarea id="b-desc" rows="3" maxlength="200" placeholder="pl. van benne ceruzás jegyzet"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Hirdetés feladása</button>
        <button class="btn" type="button" id="b-cancel">Mégse</button>
      </div>
    </form>

    <form class="filters filters-5" id="book-filters" role="search" aria-label="Hirdetések szűrése">
      <div class="field">
        <label for="k-q">Keresés</label>
        <input type="search" id="k-q" placeholder="pl. fizika" autocomplete="off">
      </div>
      <div class="field">
        <label for="k-subject">Tantárgy</label>
        <select id="k-subject"></select>
      </div>
      <div class="field">
        <label for="k-grade">Évfolyam</label>
        <select id="k-grade"></select>
      </div>
      <div class="field">
        <label for="k-sort">Rendezés</label>
        <select id="k-sort">
          <option value="new">Legújabb elöl</option>
          <option value="price">Olcsóbb elöl</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="k-fav"> Csak a kedvenceim</label>
    </form>
    <p class="muted" id="book-count" aria-live="polite"></p>
    <div class="grid" id="book-grid"></div>
  </main>

  <footer class="site-footer"></footer>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <!-- Megerősítés (törlés) -->
  <dialog id="confirm-dialog" aria-labelledby="dlg-title">
    <form method="dialog">
      <h2 id="dlg-title"></h2>
      <p id="dlg-text"></p>
      <div class="actions">
        <button class="btn" value="cancel">Mégse</button>
        <button class="btn btn-danger" value="ok" id="dlg-ok">Rendben</button>
      </div>
    </form>
  </dialog>

  <script src="konyv.js"></script>
</body>
</html>
